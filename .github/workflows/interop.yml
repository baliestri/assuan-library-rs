name: GnuPG interoperability

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      ASSUAN_GNUPG_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust
        shell: bash
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Install GnuPG on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg
          echo "ASSUAN_GPGCONF=$(command -v gpgconf)" >> "$GITHUB_ENV"
          echo "ASSUAN_GPG_CONNECT_AGENT=$(command -v gpg-connect-agent)" >> "$GITHUB_ENV"
      - name: Install GnuPG on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install gnupg
          echo "ASSUAN_GPGCONF=$(brew --prefix gnupg)/bin/gpgconf" >> "$GITHUB_ENV"
          echo "ASSUAN_GPG_CONNECT_AGENT=$(brew --prefix gnupg)/bin/gpg-connect-agent" >> "$GITHUB_ENV"
      - name: Install GnuPG on Windows
        if: runner.os == 'Windows'
        timeout-minutes: 4
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process -Force
          $scoopRoot = Join-Path $env:RUNNER_TEMP 'assuan-scoop'
          $installer = Join-Path $env:RUNNER_TEMP 'install-scoop.ps1'
          Invoke-WebRequest -Uri 'https://get.scoop.sh' -OutFile $installer
          & $installer -RunAsAdmin -ScoopDir $scoopRoot
          if ($LASTEXITCODE -ne 0) { throw 'Scoop installation failed' }
          $scoop = Join-Path $scoopRoot 'shims\scoop.ps1'
          & $scoop install main/gnupg
          if ($LASTEXITCODE -ne 0) { throw 'GnuPG installation failed' }
          $bin = Join-Path $scoopRoot 'apps\gnupg\current\bin'
          foreach ($tool in 'gpgconf.exe', 'gpg-connect-agent.exe', 'gpg-agent.exe') {
            if (-not (Test-Path -LiteralPath (Join-Path $bin $tool) -PathType Leaf)) {
              throw "Required GnuPG executable was not found: $tool"
            }
          }
          "ASSUAN_GPGCONF=$(Join-Path $bin 'gpgconf.exe')" >> $env:GITHUB_ENV
          "ASSUAN_GPG_CONNECT_AGENT=$(Join-Path $bin 'gpg-connect-agent.exe')" >> $env:GITHUB_ENV
      - name: Test independent peers and isolated agent
        if: runner.os != 'Windows'
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/assuan-target
        run: cargo test -p assuan-library --test interop_agent --test interop_server -- --nocapture
      - name: Test with short Windows tool paths
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/assuan-target
        run: ./scripts/test-interop.ps1
