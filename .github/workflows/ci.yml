name: CI

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact commit to validate (40 lowercase hexadecimal characters).
        required: true
        type: string
    outputs:
      source_sha:
        description: Commit validated by every required job.
        value: ${{ jobs.gate.outputs.source_sha }}
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Validate gate inputs
        id: source
        shell: pwsh
        env:
          CALL_INPUTS: ${{ toJSON(inputs) }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $call = $env:CALL_INPUTS | ConvertFrom-Json -AsHashtable -NoEnumerate
          if ($null -eq $call) { $call = @{} }
          if ($call -isnot [Collections.IDictionary]) { throw 'Invalid release inputs.' }
          $sha = if ($call.ContainsKey('source_sha')) { $call.source_sha } else { $env:EVENT_SHA }
          if ($sha -isnot [string] -or $sha -cnotmatch '\A[0-9a-f]{40}\z') { throw 'Expected a full lowercase commit SHA.' }
          "source_sha=$sha" >> $env:GITHUB_OUTPUT
  check:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: ["1.98.1", stable]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
      RUSTDOCFLAGS: -D warnings -D rustdoc::broken_intra_doc_links
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - name: Verify checkout
        shell: pwsh
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect gate checkout.' }
          if ($env:SOURCE_SHA -cnotmatch '\A[0-9a-f]{40}\z' -or $actual -cne $env:SOURCE_SHA) { throw 'Gate checkout does not match the requested SHA.' }
          "Verified checkout: $actual" >> $env:GITHUB_STEP_SUMMARY
      - name: Install matrix toolchain
        run: |
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version --verbose
          cargo --version
      - name: Resolve dependencies once
        run: cargo generate-lockfile
      - name: Check production libraries without test targets
        run: cargo check --locked --workspace --lib
      - name: Build public documentation without test targets
        run: cargo doc --locked --workspace --no-deps
      - name: Verify isolated feature combinations
        run: ./scripts/verify-features.ps1
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Unit, property, integration, UI and documentation tests
        # Real GnuPG tests run in interop.yml with mandatory tool provisioning.
        run: >-
          cargo test --locked --workspace --all-features --
          --skip agent_getinfo_returns_a_version
          --skip dropping_fixture_stops_its_agent_and_removes_its_home
          --skip gpg_connect_agent_drives_the_server_over_a_raw_unix_socket
      - name: Document all features
        run: cargo doc --locked --workspace --all-features --no-deps
      - name: Record resolved dependencies
        if: always()
        run: |
          cargo tree --locked --workspace --all-features > resolved-dependencies.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: dependencies-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}-${{ matrix.rust }}
          path: |
            Cargo.lock
            resolved-dependencies.txt
          if-no-files-found: warn
  format:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - name: Verify checkout
        shell: pwsh
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect gate checkout.' }
          if ($env:SOURCE_SHA -cnotmatch '\A[0-9a-f]{40}\z' -or $actual -cne $env:SOURCE_SHA) { throw 'Gate checkout does not match the requested SHA.' }
          "Verified checkout: $actual" >> $env:GITHUB_STEP_SUMMARY
      - run: rustup toolchain install nightly --profile minimal --component rustfmt
      - run: cargo +nightly fmt --all -- --check
      - run: cargo +nightly fmt --manifest-path fuzz/Cargo.toml --all -- --check
      - name: Validate workflows
        run: |
          mapfile -d '' workflows < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 | LC_ALL=C sort -z)
          test "${#workflows[@]}" -gt 0
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            "${workflows[@]}"
  dependencies:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - name: Verify checkout
        shell: pwsh
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect gate checkout.' }
          if ($env:SOURCE_SHA -cnotmatch '\A[0-9a-f]{40}\z' -or $actual -cne $env:SOURCE_SHA) { throw 'Gate checkout does not match the requested SHA.' }
          "Verified checkout: $actual" >> $env:GITHUB_STEP_SUMMARY
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: cargo install cargo-deny --locked
      - run: cargo generate-lockfile
      - run: cargo deny --locked --all-features check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: dependencies-${{ github.run_id }}-${{ github.run_attempt }}-audit
          path: Cargo.lock
  release_scripts:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      RUSTDOCFLAGS: -D warnings -D rustdoc::broken_intra_doc_links
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - name: Verify checkout
        shell: pwsh
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect gate checkout.' }
          if ($env:SOURCE_SHA -cnotmatch '\A[0-9a-f]{40}\z' -or $actual -cne $env:SOURCE_SHA) { throw 'Gate checkout does not match the requested SHA.' }
          "Verified checkout: $actual" >> $env:GITHUB_STEP_SUMMARY
      - name: Install pinned PowerShell
        shell: bash
        run: |
          archive="$RUNNER_TEMP/powershell-7.6.6-linux-x64.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            https://github.com/PowerShell/PowerShell/releases/download/v7.6.6/powershell-7.6.6-linux-x64.tar.gz
          echo "ddbc4a2d113bbd46d283cfedcbcd117a70caefd7673f41f2b4e0000badf103bc  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/assuan-pwsh"
          tar -xzf "$archive" -C "$RUNNER_TEMP/assuan-pwsh"
          chmod +x "$RUNNER_TEMP/assuan-pwsh/pwsh"
          echo "$RUNNER_TEMP/assuan-pwsh" >> "$GITHUB_PATH"
      - name: Verify generator toolchain
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion.ToString() -cne '7.6.6') { throw 'Wrong PowerShell version.' }
          rustup toolchain install 1.98.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Resolve documentation dependencies
        shell: pwsh
        run: cargo generate-lockfile
      - name: Test release and documentation scripts
        shell: pwsh
        run: ./scripts/test-release.ps1
      - name: Build public API for deterministic site verification
        shell: pwsh
        run: cargo doc --locked --workspace --all-features --no-deps
      - name: Verify deterministic documentation bundles
        shell: pwsh
        run: ./scripts/verify-docs.ps1
  gate:
    if: ${{ always() }}
    needs: [prepare, check, format, dependencies, release_scripts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.result.outputs.source_sha }}
    steps:
      - name: Report completed gate
        id: result
        shell: pwsh
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          $results = $env:JOB_RESULTS | ConvertFrom-Json -AsHashtable
          foreach ($job in $results.Values) {
            if ($job.result -cne 'success') { throw 'A required gate job did not succeed.' }
          }
          if ($env:SOURCE_SHA -cnotmatch '\A[0-9a-f]{40}\z') { throw 'Missing validated gate SHA.' }
          "source_sha=$env:SOURCE_SHA" >> $env:GITHUB_OUTPUT
          "All required jobs passed for commit $env:SOURCE_SHA" >> $env:GITHUB_STEP_SUMMARY
