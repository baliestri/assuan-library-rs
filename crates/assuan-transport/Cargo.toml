[package]
name = "assuan-transport"
description = "Extensible asynchronous streams and TCP transport for Assuan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[package.metadata.docs.rs]
features = []
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin"]

[dependencies]
tokio = { workspace = true, features = ["net", "io-util", "time", "rt", "process", "macros"] }
thiserror.workspace = true
zeroize.workspace = true
assuan-protocol = { version = "0.1.0", path = "../assuan-protocol" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[target.'cfg(windows)'.dependencies]
interprocess = { version = "2.4", features = ["tokio"] }
winsafe = { version = "0.0.29", features = ["advapi", "kernel"] }
widestring = "1"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "test-util"] }

[lints]
workspace = true

[features]
test-fixtures = []

[[bin]]
name = "gpgconf_stub"
path = "tests/fixtures/gpgconf_stub.rs"
required-features = ["test-fixtures"]
test = false
bench = false
