[package]
name = "assuan-transport"
description = "Extensible asynchronous streams and TCP transport for Assuan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
tokio = { workspace = true, features = ["net", "io-util", "time", "rt"] }
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[target.'cfg(windows)'.dependencies]
interprocess = { version = "2.4", features = ["tokio"] }
winsafe = { version = "0.0.29", features = ["advapi", "kernel"] }
widestring = "1"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "test-util"] }

[lints]
workspace = true
