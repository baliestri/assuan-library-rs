[package]
name = "assuan-macros"
description = "Compile-time validated Assuan commands and canonical S-expression literals"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[lib]
proc-macro = true

[dependencies]
assuan-protocol = { path = "../assuan-protocol", version = "1.0.0", default-features = false }
assuan-sexpr = { path = "../assuan-sexpr", version = "1.0.0", default-features = false }
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true
proc-macro-crate.workspace = true

[dev-dependencies]
assuan-server = { path = "../assuan-server", version = "1.0.0" }

[lints]
workspace = true
