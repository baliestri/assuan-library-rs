[package]
name = "assuan-client"
description = "Borrowed asynchronous Assuan client transactions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin"]

[dependencies]
assuan-protocol = { version = "1.0.0", path = "../assuan-protocol" }
assuan-transport = { version = "1.0.0", path = "../assuan-transport" }
tokio = { workspace = true, features = ["time"] }
zeroize.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "io-util", "test-util"] }

[lints]
workspace = true
